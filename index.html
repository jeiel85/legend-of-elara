<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>엘라라의 전설 (The Legend of Elara)</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#06060f">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div id="wrap">
  <h1 id="logo">엘라라의 전설</h1>
  <div id="stage">
    <canvas id="game" width="480" height="320"></canvas>
    <div id="touch">
      <div id="dpad">
        <button data-key="up" aria-label="위">▲</button>
        <div class="mid">
          <button data-key="left" aria-label="왼쪽">◀</button>
          <button data-key="down" aria-label="아래">▼</button>
          <button data-key="right" aria-label="오른쪽">▶</button>
        </div>
      </div>
      <div id="btns">
        <button data-key="attack" aria-label="공격">검</button>
        <button data-key="use" aria-label="아이템">템</button>
        <button data-key="interact" aria-label="대화">E</button>
        <button data-key="inventory" aria-label="인벤토리">가방</button>
      </div>
    </div>
  </div>
  <div id="help">
    <p>이동: WASD/방향키 · 검: Z/J/Space · 아이템: X/K · 전환: C/L · 대화: E/Enter · 가방: I/Tab · 목표: Q · 음소거: M</p>
    <p><button data-action="mute">소리 켜기/끄기 (M)</button> <button data-action="inventory">인벤토리 (I)</button> <button data-action="auto">▶ 자동진행 (P)</button></p>
    <p><a class="repo-link" href="https://github.com/jeiel85/legend-of-elara" target="_blank" rel="noopener noreferrer" aria-label="GitHub 저장소 열기 (jeiel85/legend-of-elara)"><svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg> 소스 코드 · GitHub</a></p>
  </div>
</div>
<script type="module" src="./js/main.js"></script>
<script type="module">
import { startFromDOM } from './js/main.js';
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => startFromDOM());
} else {
  startFromDOM();
}
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch((err) => {
        console.warn('서비스워커 등록 실패:', err);
      });
    });
  }
</script>
</body>
</html>
